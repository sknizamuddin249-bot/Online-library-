<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;800&amp;family=Noto+Sans+Bengali:wght@800;900&amp;display=swap');
      .bengali-title {
        font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
        font-weight: 900;
        text-anchor: middle;
      }
    </style>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="250" cy="250" r="238" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#subtle-shadow)" />

  <!-- SHOPPING CART WITH 3 BOOKS -->
  <g transform="translate(170, 70)">
    <!-- Cart Handle & Basket Frame -->
    <path d="M 5 8 L 22 8 L 38 65 L 125 65 L 138 25 L 45 25" fill="none" stroke="#0B1B3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cart Inner Wire Grid Lines -->
    <path d="M 52 25 L 45 65 M 75 25 L 72 65 M 98 25 L 98 65 M 120 25 L 122 65" fill="none" stroke="#0B1B3D" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 45 L 130 45" fill="none" stroke="#0B1B3D" stroke-width="3" stroke-linecap="round" />

    <!-- Cart Wheels -->
    <circle cx="50" cy="80" r="8" fill="#0B1B3D" />
    <circle cx="50" cy="80" r="3" fill="#FFFFFF" />
    <circle cx="112" cy="80" r="8" fill="#0B1B3D" />
    <circle cx="112" cy="80" r="3" fill="#FFFFFF" />

    <!-- 3 Books inside Cart -->
    <!-- Book 1 (Orange) -->
    <rect x="46" y="10" width="18" height="42" rx="3" fill="#FF5722" />
    <rect x="49" y="16" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="49" y="24" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Book 2 (Blue) -->
    <rect x="70" y="8" width="18" height="44" rx="3" fill="#0288D1" />
    <rect x="73" y="15" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="73" y="23" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Book 3 (Green) -->
    <rect x="94" y="12" width="18" height="40" rx="3" fill="#4CAF50" />
    <rect x="97" y="18" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="97" y="26" width="12" height="4" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- LARGE OPEN BOOK -->
  <g transform="translate(60, 160)">
    <!-- Left Cover & Pages Arch -->
    <path d="M 190 65 Q 110 30 10 65 L 45 130 Q 125 90 190 120 Z" fill="#0B1B3D" />
    <!-- Left Inner White Pages -->
    <path d="M 185 70 Q 115 40 25 72 L 52 122 Q 128 88 185 112 Z" fill="#FFFFFF" />
    <path d="M 180 75 Q 120 50 40 80" fill="none" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 180 88 Q 120 62 50 92" fill="none" stroke="#E2E8F0" stroke-width="2" />

    <!-- Right Cover & Pages Arch -->
    <path d="M 190 65 Q 270 30 370 65 L 335 130 Q 255 90 190 120 Z" fill="#0B1B3D" />
    <!-- Right Inner White Pages -->
    <path d="M 195 70 Q 265 40 355 72 L 328 122 Q 252 88 195 112 Z" fill="#FFFFFF" />
    <path d="M 200 75 Q 260 50 340 80" fill="none" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 200 88 Q 260 62 330 92" fill="none" stroke="#E2E8F0" stroke-width="2" />

    <!-- Center Spine Crease -->
    <path d="M 190 62 L 190 125" fill="none" stroke="#0B1B3D" stroke-width="4" stroke-linecap="round" />

    <!-- Center Orange Ribbon Bookmark -->
    <polygon points="180,120 200,120 200,148 190,138 180,148" fill="#FF5722" />
  </g>

  <!-- BENGALI TYPOGRAPHY -->
  <!-- Line 1: অনলাইন (Navy Blue / Dark Slate) -->
  <text x="250" y="325" class="bengali-title" font-size="64" fill="#0B1B3D" letter-spacing="1">অনলাইন</text>

  <!-- Line 2: লাইব্রেরি (Vibrant Orange) -->
  <text x="250" y="405" class="bengali-title" font-size="62" fill="#FF5722" letter-spacing="1">লাইব্রেরি</text>

  <!-- Bottom Decorative Divider Line with Accent Dot -->
  <line x1="140" y1="428" x2="360" y2="428" stroke="#0B1B3D" stroke-width="3" stroke-linecap="round" />
  <circle cx="250" cy="428" r="6" fill="#FF5722" />
</svg>
